<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>モザイク — きおくの まちがいさがし | JP RECORDS</title>
<meta name="description" content="JP「モザイク」の世界。同じ記憶を二回思い出すと、二回目はどこかが違う。一番近くにいるはずのあなたは、誰？">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; background:#0b0714; touch-action:manipulation; }
  body { font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif; color:#f2e9ff;
         display:flex; align-items:center; justify-content:center; }

  #stage { position:relative; aspect-ratio:16/9; width:min(100vw, calc(100vh * 16 / 9));
           background:#0b0714; overflow:hidden; }
  #scene { position:absolute; inset:0; width:100%; height:100%; object-fit:fill; transition:opacity 1s ease; }
  #scrim { position:absolute; inset:0; pointer-events:none;
           background:linear-gradient(to top, rgba(10,6,18,.85) 0%, rgba(10,6,18,.35) 20%, transparent 42%); }

  #mono { position:absolute; left:5%; right:5%; bottom:15%; display:flex; flex-direction:column; gap:.6em; pointer-events:none; }
  .mline { font-size:clamp(15px,2.6vh,24px); letter-spacing:.14em; line-height:1.8; font-weight:300;
           color:#f6eeff; text-shadow:0 0 10px rgba(10,6,18,.95), 0 1px 16px rgba(10,6,18,.9);
           opacity:0; transform:translateY(8px); transition:opacity .9s ease, transform .9s ease; }
  .mline.on { opacity:1; transform:none; }
  #adv { position:absolute; right:4%; bottom:3.5%; color:rgba(246,238,255,.7); font-size:clamp(12px,1.8vh,15px);
         animation:blink 1.6s infinite; pointer-events:none; opacity:0; transition:opacity .5s; }
  @keyframes blink { 50% { opacity:.2; } }

  #ui { position:absolute; left:0; right:0; bottom:0; padding:2% 4% 2.5%; display:none;
        flex-direction:column; align-items:center; gap:1.6vh; }
  #ui.on { display:flex; }
  .qtext { font-size:clamp(15px,2.6vh,24px); letter-spacing:.16em; font-weight:300;
           text-shadow:0 0 12px rgba(10,6,18,.95), 0 1px 18px rgba(10,6,18,.9); }
  .cbtn { font-family:inherit; font-size:clamp(15px,2.4vh,22px); letter-spacing:.24em; text-indent:.24em; color:#f2e9ff;
          background:rgba(26,16,40,.75); border:1px solid rgba(242,233,255,.45); border-radius:2em;
          padding:.6em 1.8em; cursor:pointer; transition:all .3s; }
  .cbtn:hover { background:rgba(242,233,255,.16); box-shadow:0 0 18px rgba(255,120,220,.25); }

  /* きのうの記憶サムネ */
  #memo { position:absolute; left:2.5%; top:3.5%; width:22%; border:1px solid rgba(242,233,255,.5);
          border-radius:6px; overflow:hidden; box-shadow:0 6px 20px rgba(0,0,0,.55); display:none; }
  #memo img { width:100%; display:block; }
  #memo .cap { position:absolute; left:0; right:0; bottom:0; font-size:clamp(10px,1.5vh,13px); letter-spacing:.2em;
               text-align:center; padding:.25em 0; background:rgba(10,6,18,.72); }

  .hot { position:absolute; cursor:pointer; }
  #pulse { position:absolute; border:2px solid rgba(255,150,230,.95); border-radius:50%;
           box-shadow:0 0 24px rgba(255,150,230,.7); pointer-events:none; opacity:0; }
  @keyframes ring { 0% { transform:scale(.4); opacity:1; } 100% { transform:scale(1.25); opacity:0; } }

  .hintb { position:absolute; right:2.5%; top:3.5%; font-family:inherit; font-size:clamp(12px,1.8vh,15px);
           letter-spacing:.2em; color:rgba(242,233,255,.65); background:transparent;
           border:1px solid rgba(242,233,255,.3); border-radius:1.5em; padding:.4em 1.1em; cursor:pointer; display:none; }
  #hinttext { position:absolute; right:2.5%; top:9.5%; max-width:46%; font-size:clamp(13px,2vh,17px);
              color:rgba(246,238,255,.95); letter-spacing:.12em; background:rgba(26,16,40,.8);
              border-radius:.5em; padding:.5em .9em; display:none; }

  .overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
             gap:3vh; text-align:center; z-index:10; }
  #title { background:rgba(10,6,18,.45); transition:opacity 1.6s; }
  #title .bg { position:absolute; inset:0; z-index:-1; }
  #title .bg img { width:100%; height:100%; object-fit:cover; filter:brightness(.5) saturate(1.1) blur(1px); }
  #title h1 { font-size:clamp(46px,9.5vh,92px); font-weight:300; letter-spacing:.5em; text-indent:.5em;
              text-shadow:0 0 30px rgba(255,120,220,.55), 0 0 60px rgba(120,180,255,.35); }
  #title .sub { font-size:clamp(13px,2.1vh,18px); letter-spacing:.42em; text-indent:.42em; color:rgba(246,238,255,.9); }
  #start { margin-top:3.5vh; font-family:inherit; font-size:clamp(16px,2.5vh,23px); letter-spacing:.4em; text-indent:.4em;
           color:#f2e9ff; background:transparent; border:1px solid rgba(242,233,255,.55); border-radius:2em;
           padding:.85em 2.4em; cursor:pointer; transition:all .4s; }
  #start:disabled { opacity:.35; cursor:default; }
  #start:not(:disabled):hover { background:rgba(242,233,255,.12); box-shadow:0 0 24px rgba(255,120,220,.35); }
  #title .credit { position:absolute; bottom:3vh; font-size:12px; letter-spacing:.2em; color:rgba(246,238,255,.5); }

  #ending { background:#07040d; opacity:0; pointer-events:none; transition:opacity 2.5s ease; z-index:20; }
  #ending .bg { position:absolute; inset:0; }
  #ending .bg img { width:100%; height:100%; object-fit:cover; transition:opacity 1.5s ease; }
  #elyric { position:relative; font-size:clamp(20px,3.6vh,34px); letter-spacing:.2em; line-height:2; font-weight:300;
            color:#f6eeff; text-shadow:0 0 14px rgba(7,4,13,.95), 0 2px 24px rgba(7,4,13,.9);
            opacity:0; transition:opacity 1s ease; }
  #endcard { position:relative; display:none; flex-direction:column; align-items:center; gap:4vh; }
  #endcard .fin { font-size:clamp(22px,4vh,38px); letter-spacing:.5em; text-indent:.5em; font-weight:300; }
  #again { font-family:inherit; font-size:clamp(13px,2vh,16px); letter-spacing:.3em; text-indent:.3em;
           color:rgba(246,238,255,.75); background:transparent; border:none; cursor:pointer; }
</style>
</head>
<body>

<div id="stage">
  <img id="scene" src="assets/img/s001.jpg" alt="">
  <div id="scrim"></div>
  <div id="fx"></div>
  <div id="memo"><img id="memoimg" src="" alt=""><div class="cap">きのうの きおく</div></div>
  <div id="pulse"></div>
  <div id="mono"></div>
  <div id="adv">▼</div>
  <div id="ui"></div>
  <button class="hintb" id="hintb">ヒント</button>
  <div id="hinttext"></div>
</div>

<div class="overlay" id="title">
  <div class="bg"><img src="assets/img/s001.jpg" alt=""></div>
  <h1>モザイク</h1>
  <div class="sub">— きおくの まちがいさがし —</div>
  <button id="start" disabled>よみこみちゅう…</button>
  <div class="credit">JP — AI MUSIC #116「モザイク」</div>
</div>

<div class="overlay" id="ending">
  <div class="bg"><img id="endbg" src="assets/img/s045.jpg" alt=""></div>
  <div id="elyric"></div>
  <div id="endcard">
    <div class="fin">おしまい</div>
    <button id="again">— もういちど おもいだす —</button>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const scene = $('scene'), fx = $('fx'), mono = $('mono'), adv = $('adv'), ui = $('ui'),
        memo = $('memo'), memoimg = $('memoimg'), pulse = $('pulse'),
        hintb = $('hintb'), hinttext = $('hinttext');
  const IMG = n => `assets/img/${n}.jpg`;

  const CH = [
    { key:'ch1', rect:[0.565,0.115,0.635,0.435],
      mono:['あさ　せんめんだいに　ふたつの コップ','どちらが どちらのか　まよわない くらいには　いっしょに いる'],
      after:['……あなたの はぶらし、こんな いろ だったっけ','ちいさな ことだ と　おもおうと した'],
      hints:['きのうと みくらべて','せんめんだいの うえ'] },
    { key:'ch2', rect:[0.055,0.520,0.245,0.685],
      mono:['かえりみち　いつもの ホーム','でんしゃを ひとつ みおくって　ならんで すわった'],
      after:['すわっていた ベンチの いろが　ちがう','きおくの なかの まちが　すこし ゆれた'],
      hints:['きのうと みくらべて','ふたりが すわった ばしょ'] },
    { key:'ch3', rect:[0.545,0.370,0.690,0.650],
      mono:['かたに　あたまの おもさ','ねむそうな こきゅう　それは たしかに おぼえてる'],
      after:['かおが……きのうと ちがう','おもいだす たびに　あなたが ぬりかわって いく'],
      hints:['きのうと みくらべて','いちばん みたい ところ'] },
    { key:'ch4', rect:[0.755,0.475,0.812,0.780],
      mono:['ふたりで みた やけい','ひかりの かずまで　おぼえてる つもりだった'],
      after:['あの ビルの あかりが　きえてる','ぼくの きおくごと　まちが かけて いく'],
      hints:['きのうと みくらべて','いちばん たかい ところ'] },
  ];
  const FINAL_MONO = ['かがみの なかの ぼくも　うまく むすばれない','それでも'];
  const LYRICS = [ // ending.mp3 = 原曲140.0s〜
    { t: 2.781,  e: 6.303,  x: 'ねえ 一番近くに　いるはずの',  img: 's045' },
    { t: 6.328,  e: 9.326,  x: 'あなたは 最後まで　わからない', img: 's045' },
    { t: 9.351,  e: 12.381, x: 'ぼやけたままの　あなたのことを', img: 's051' },
    { t: 12.406, e: 15.693, x: 'たしかに 好きだったよ',        img: 's051' },
    { t: 15.718, e: 19.867, x: 'あなたは　あなただったの？',    img: 's055' },
    { t: 22.272, e: 26.218, x: '答えのかわりに　手をにぎる',    img: 's055' },
  ];

  const bgm = new Audio('assets/audio/bgm_loop.mp3'); bgm.loop = true;
  const endTrack = new Audio('assets/audio/ending.mp3');
  const seSoft = new Audio('assets/audio/se_soft.mp3');
  const playSE = a => { try { a.currentTime = 0; a.play(); } catch (_) {} };

  const PEEK = new URLSearchParams(location.search).get('peek');

  // ---------- 独白 ----------
  let monoQueue = [], monoShown = 0, onMonoDone = null, busy = false;
  function showMono(lines, done) {
    mono.innerHTML = ''; monoQueue = lines; monoShown = 0; onMonoDone = done;
    adv.style.opacity = 1;
    advance();
  }
  function advance() {
    if (monoShown >= monoQueue.length) return;
    const d = document.createElement('div');
    d.className = 'mline'; d.textContent = monoQueue[monoShown];
    mono.appendChild(d);
    setTimeout(() => d.classList.add('on'), 50);
    monoShown++;
    if (monoShown === monoQueue.length) setTimeout(() => { adv.style.opacity = 0; onMonoDone && onMonoDone(); }, 700);
    else if (PEEK !== null) setTimeout(advance, 400);
  }
  $('stage').addEventListener('click', () => { if (!busy && monoShown < monoQueue.length) advance(); });

  function setHints(list) {
    hintb.dataset.step = 0;
    hintb.style.display = list && list.length ? '' : 'none';
    hinttext.style.display = 'none';
    hintb.onclick = e => {
      e.stopPropagation();
      const i = Math.min(+hintb.dataset.step, list.length - 1);
      hinttext.textContent = list[i]; hinttext.style.display = 'block';
      hintb.dataset.step = +hintb.dataset.step + 1;
    };
  }

  function fadeScene(src, cb) {
    scene.style.opacity = 0;
    setTimeout(() => { scene.src = src; scene.onload = () => { scene.style.opacity = 1; cb && cb(); }; }, 1000);
  }
  function px(v) { return (v * 100) + '%'; }

  // ---------- 章 ----------
  function startChapter(i) {
    if (i >= CH.length) { finalChapter(); return; }
    const ch = CH[i];
    fx.innerHTML = ''; ui.innerHTML = ''; ui.classList.remove('on');
    memo.style.display = 'none'; setHints(null); busy = false;
    fadeScene(IMG(ch.key + '_a'), () => showMono(ch.mono, () => {
      ui.classList.add('on');
      const b = document.createElement('button'); b.className = 'cbtn'; b.textContent = 'もういちど おもいだす';
      b.addEventListener('click', e => { e.stopPropagation(); ui.classList.remove('on'); search(i); });
      ui.appendChild(b);
    }));
  }

  function search(i) {
    const ch = CH[i];
    mono.style.opacity = .3;
    fadeScene(IMG(ch.key + '_b'), () => {
      memoimg.src = IMG(ch.key + '_a'); memo.style.display = 'block';
      setHints(ch.hints);
      ui.innerHTML = ''; ui.classList.add('on');
      const q = document.createElement('div'); q.className = 'qtext'; q.textContent = 'どこかが　ちがう';
      ui.appendChild(q);
      // 正解ホットスポット
      const [x0, y0, x1, y1] = ch.rect;
      const hot = document.createElement('div'); hot.className = 'hot';
      hot.style.cssText = `left:${x0*100}%; top:${y0*100}%; width:${(x1-x0)*100}%; height:${(y1-y0)*100}%;`;
      hot.addEventListener('click', e => { e.stopPropagation(); found(i, (x0+x1)/2, (y0+y1)/2); });
      fx.appendChild(hot);
      // ハズレ反応（ステージ全体）
      $('stage').addEventListener('click', missHandler);
      function missHandler(e) {
        if (busy || !fx.contains(hot)) { $('stage').removeEventListener('click', missHandler); return; }
        q.textContent = '……ここは おなじ';
        setTimeout(() => q.textContent = 'どこかが　ちがう', 1100);
      }
    });
  }

  function found(i, cx, cy) {
    busy = true;
    playSE(seSoft);
    fx.innerHTML = '';
    const s = $('stage').getBoundingClientRect();
    const r = Math.max(60, s.width * 0.09);
    pulse.style.cssText = `left:${cx*100}%; top:${cy*100}%; width:${r}px; height:${r}px; margin:${-r/2}px 0 0 ${-r/2}px; opacity:1; animation:ring 1.3s ease-out 2;`;
    setTimeout(() => { pulse.style.opacity = 0; pulse.style.animation = ''; }, 2700);
    memo.style.display = 'none'; setHints(null);
    ui.classList.remove('on'); mono.style.opacity = 1;
    setTimeout(() => { busy = false; showMono(CH[i].after, () => setTimeout(() => startChapter(i + 1), 900)); }, 1500);
  }

  // ---------- 終章 ----------
  function finalChapter() {
    fx.innerHTML = ''; memo.style.display = 'none'; setHints(null); busy = false;
    const f = setInterval(() => { bgm.volume = Math.max(0, bgm.volume - .05); if (bgm.volume <= 0) { bgm.pause(); clearInterval(f); } }, 110);
    fadeScene(IMG('s040'), () => showMono(FINAL_MONO, () => {
      ui.innerHTML = ''; ui.classList.add('on');
      const q = document.createElement('div'); q.className = 'qtext';
      q.textContent = 'いちばん ちかくに いる あなたは、だれ？';
      const b = document.createElement('button'); b.className = 'cbtn'; b.textContent = '手をにぎる';
      b.addEventListener('click', e => { e.stopPropagation(); ui.classList.remove('on'); startEnding(); });
      ui.appendChild(q); ui.appendChild(b);
    }));
  }

  // ---------- エンディング ----------
  function startEnding() {
    busy = true;
    const ov = $('ending'), ly = $('elyric'), bg = $('endbg');
    ov.style.pointerEvents = 'auto'; ov.style.opacity = 1;
    endTrack.volume = 1; endTrack.play().catch(() => {});
    let li = -1;
    const tick = () => {
      const t = endTrack.currentTime;
      const cur = LYRICS.findIndex(L => t >= L.t && t <= L.e);
      if (cur !== li) {
        if (cur === -1) ly.style.opacity = 0;
        else {
          ly.textContent = LYRICS[cur].x; ly.style.opacity = 1;
          if (bg.src.indexOf(LYRICS[cur].img) === -1) bg.src = IMG(LYRICS[cur].img);
        }
        li = cur;
      }
      if (t > 27 && bg.src.indexOf('s057') === -1 && t < 36) bg.src = IMG('s057');
      if (t > 36 && bg.src.indexOf('s058') === -1) bg.src = IMG('s058');
      if (!endTrack.ended) requestAnimationFrame(tick);
      else { ly.style.opacity = 0; setTimeout(() => $('endcard').style.display = 'flex', 1500); }
    };
    requestAnimationFrame(tick);
    $('again').addEventListener('click', () => location.reload());
  }

  // ---------- 起動 ----------
  const toLoad = ['s001','s040','s045','s051','s055','s057','s058',
                  'ch1_a','ch1_b','ch2_a','ch2_b','ch3_a','ch3_b','ch4_a','ch4_b'];
  let loaded = 0;
  const startBtn = $('start');
  toLoad.forEach(n => { const im = new Image(); im.onload = im.onerror = () => {
    loaded++;
    startBtn.textContent = loaded >= toLoad.length ? '— おもいだす —' : `よみこみちゅう… ${Math.round(loaded/toLoad.length*100)}%`;
    if (loaded >= toLoad.length) { startBtn.disabled = false; if (PEEK !== null) startBtn.click(); }
  }; im.src = IMG(n); });

  startBtn.addEventListener('click', () => {
    $('title').style.opacity = 0;
    setTimeout(() => $('title').style.display = 'none', 1500);
    bgm.volume = 1; bgm.play().catch(() => {});
    if (PEEK === 'final') finalChapter();
    else if (PEEK === 'ending') startEnding();
    else startChapter(PEEK && PEEK.startsWith('ch') ? Math.min(3, Math.max(0, parseInt(PEEK.slice(2)) - 1)) : 0);
  });
})();
</script>
</body>
</html>
