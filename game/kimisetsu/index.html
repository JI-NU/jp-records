<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>キミセツ — 合わせる 合わせる ダイヤル | JP RECORDS</title>
<meta name="description" content="JP「キミセツ」の世界。ノイズの海に、それらしい信号がいくつも浮かぶ。ほんもののキミの周波数は、ひとつだけ。">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; background:#1a1430; touch-action:none; }
  body { font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif; color:#f5eefc;
         display:flex; align-items:center; justify-content:center; user-select:none; -webkit-user-select:none; }

  #stage { position:relative; aspect-ratio:16/9; width:min(100vw, calc(100vh * 16 / 9));
           background:#1a1430; overflow:hidden; cursor:ew-resize; }
  #scene { position:absolute; inset:0; width:100%; height:100%; object-fit:fill; transition:opacity 1.2s ease; }
  #static { position:absolute; inset:0; width:100%; height:100%; }

  #mono { position:absolute; left:0; right:0; top:9%; text-align:center; pointer-events:none; }
  .mline { font-size:clamp(15px,2.7vh,25px); letter-spacing:.16em; line-height:2; color:#f8f3ff;
           text-shadow:0 0 12px rgba(26,20,48,.95), 0 0 26px rgba(26,20,48,.9);
           opacity:0; transition:opacity 1s ease; }
  .mline.on { opacity:1; }

  /* つながった演出 */
  #lockflash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
  #connected { position:absolute; left:50%; top:34%; transform:translate(-50%,-50%) scale(.6); opacity:0;
               font-size:clamp(26px,6vh,56px); letter-spacing:.3em; text-indent:.3em; color:#fff;
               text-shadow:0 0 24px rgba(255,120,220,.9), 0 0 60px rgba(140,120,255,.7);
               pointer-events:none; transition:all .3s cubic-bezier(.3,1.5,.5,1); z-index:6; }
  #connected.on { opacity:1; transform:translate(-50%,-50%) scale(1); }

  /* ラジオ盤 */
  #radio { position:absolute; left:8%; right:8%; bottom:5%; height:24%; border-radius:1.4vh;
           background:linear-gradient(rgba(30,22,56,.9), rgba(20,14,40,.94));
           border:1px solid rgba(240,170,255,.35); box-shadow:0 8px 30px rgba(0,0,0,.5), inset 0 0 24px rgba(150,90,220,.12); }
  #scale { position:absolute; left:5%; right:5%; top:12%; height:30%; }
  #scale .band { position:absolute; left:0; right:0; top:52%; height:2px; background:rgba(240,170,255,.4); }
  .tickL { position:absolute; top:28%; width:1px; height:46%; background:rgba(240,170,255,.4); }
  .tickN { position:absolute; top:-30%; font-size:clamp(9px,1.6vh,13px); color:rgba(245,238,252,.75); transform:translateX(-50%); letter-spacing:.05em; }
  #needle { position:absolute; top:0; width:3px; height:100%; background:#ff77dd; margin-left:-1.5px;
            box-shadow:0 0 10px rgba(255,120,220,.9); }
  #freq { position:absolute; right:5%; bottom:8%; font-size:clamp(14px,2.6vh,22px); letter-spacing:.1em;
          color:#ffd9f6; text-shadow:0 0 10px rgba(255,120,220,.6); font-variant-numeric:tabular-nums; }
  #spec { position:absolute; left:5%; right:5%; width:90%; bottom:8%; height:44%; }
  #sig { position:absolute; left:5%; bottom:56%; font-size:clamp(11px,2vh,16px); letter-spacing:.2em;
         color:rgba(245,238,252,.85); text-shadow:0 0 8px rgba(26,20,48,.9); }
  #lockring { position:absolute; left:50%; top:38%; width:13vh; height:13vh; margin:-6.5vh 0 0 -6.5vh; border-radius:50%;
              border:3px solid rgba(255,150,235,.95); opacity:0; pointer-events:none;
              box-shadow:0 0 24px rgba(255,120,220,.5); }
  #lockpct { position:absolute; left:50%; top:38%; transform:translate(-50%,-50%); font-size:clamp(15px,3vh,26px);
             letter-spacing:.1em; color:#fff; text-shadow:0 0 12px rgba(255,120,220,.8); opacity:0; pointer-events:none; }
  #hintline { position:absolute; left:0; right:0; top:4%; text-align:center; font-size:clamp(12px,2.1vh,17px);
              letter-spacing:.24em; color:rgba(245,238,252,.75); text-shadow:0 1px 8px rgba(26,20,48,.9); pointer-events:none;
              opacity:0; transition:opacity 1s; }

  #ui { position:absolute; left:0; right:0; bottom:32%; display:none; flex-direction:column; align-items:center; gap:1.8vh; z-index:5; }
  #ui.on { display:flex; }
  .cbtn { font-family:inherit; font-size:clamp(15px,2.5vh,22px); letter-spacing:.22em; text-indent:.22em; color:#f8f3ff;
          background:rgba(40,28,72,.85); border:1px solid rgba(240,170,255,.5); border-radius:2em;
          padding:.6em 1.9em; cursor:pointer; transition:all .3s; }
  .cbtn:hover { background:rgba(240,170,255,.16); box-shadow:0 0 18px rgba(255,120,220,.35); }

  .overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
             gap:3vh; text-align:center; z-index:10; }
  #title { background:rgba(26,20,48,.45); transition:opacity 1.6s; }
  #title .bg { position:absolute; inset:0; z-index:-1; }
  #title .bg img { width:100%; height:100%; object-fit:cover; filter:brightness(.75); }
  #title h1 { font-size:clamp(42px,9.5vh,92px); font-weight:300; letter-spacing:.4em; text-indent:.4em;
              text-shadow:0 0 26px rgba(255,120,220,.6), 0 0 60px rgba(140,120,255,.4); }
  #title .sub { font-size:clamp(13px,2.1vh,18px); letter-spacing:.3em; text-indent:.3em; color:rgba(248,243,255,.9); }
  #start { margin-top:3.5vh; font-family:inherit; font-size:clamp(16px,2.5vh,23px); letter-spacing:.34em; text-indent:.34em;
           color:#f8f3ff; background:transparent; border:1px solid rgba(240,170,255,.55); border-radius:2em;
           padding:.85em 2.4em; cursor:pointer; transition:all .4s; }
  #start:disabled { opacity:.35; cursor:default; }
  #start:not(:disabled):hover { background:rgba(240,170,255,.14); box-shadow:0 0 24px rgba(255,120,220,.4); }
  #title .credit { position:absolute; bottom:3vh; font-size:12px; letter-spacing:.2em; color:rgba(248,243,255,.55); }

  #ending { background:#141026; opacity:0; pointer-events:none; transition:opacity 2.5s ease; z-index:20; }
  #ending .bg { position:absolute; inset:0; }
  #ending .bg img { width:100%; height:100%; object-fit:fill; transition:opacity 1.1s ease; }
  #endcard { position:relative; display:none; flex-direction:column; align-items:center; gap:3.5vh; }
  #endcard .fin { font-size:clamp(18px,3.4vh,33px); letter-spacing:.28em; text-indent:.28em; color:#f8f3ff;
                  text-shadow:0 0 16px rgba(26,20,48,.9); }
  #again { font-family:inherit; font-size:clamp(13px,2vh,16px); letter-spacing:.3em; text-indent:.3em;
           color:rgba(248,243,255,.8); background:rgba(26,20,48,.55); border:1px solid rgba(240,170,255,.4);
           border-radius:2em; padding:.5em 1.4em; cursor:pointer; }
</style>
</head>
<body>

<div id="stage">
  <img id="scene" src="assets/img/r1.jpg" alt="">
  <canvas id="static" width="640" height="360"></canvas>
  <div id="hintline">よこに ドラッグ。ほんものの しんごうは ひとつだけ</div>
  <div id="mono"><div class="mline" id="mline"></div></div>
  <div id="lockring"></div>
  <div id="lockpct"></div>
  <div id="lockflash"></div>
  <div id="connected">―― つながった ――</div>
  <div id="ui"></div>
  <div id="radio">
    <div id="scale"><div class="band"></div><div id="needle"></div></div>
    <canvas id="spec" width="1000" height="120"></canvas>
    <div id="sig">SIGNAL</div>
    <div id="freq">76.0 MHz</div>
  </div>
</div>

<div class="overlay" id="title">
  <div class="bg"><img src="assets/img/title.jpg" alt=""></div>
  <h1>キミセツ</h1>
  <div class="sub">— ノイズの うみに、にせものの しんごうが まじってる —</div>
  <button id="start" disabled>よみこみちゅう…</button>
  <div class="credit">JP — AI MUSIC #108「キミセツ」</div>
</div>

<div class="overlay" id="ending">
  <div class="bg"><img id="endbg" src="assets/img/e1.jpg" alt=""></div>
  <div id="endcard">
    <div class="fin">また あした、おなじ しゅうはすうで</div>
    <button id="again">— もういちど あわせる —</button>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const stage = $('stage'), scene = $('scene'), stat = $('static'), sctx = stat.getContext('2d'),
        spec = $('spec'), pctx = spec.getContext('2d'), needle = $('needle'),
        freqEl = $('freq'), mline = $('mline'), lockring = $('lockring'), lockpct = $('lockpct'),
        ui = $('ui'), hintline = $('hintline'), sig = $('sig');
  const IMG = n => `assets/img/${n}.jpg`;
  const PEEK = new URLSearchParams(location.search).get('peek');
  const wait = ms => new Promise(r => setTimeout(r, ms));

  // ---------- 受信ラウンド ----------
  const ROUNDS = [
    { bg:'r1', img:'f1', audio:'frag1', decoys:1, escapes:0 },
    { bg:'r2', img:'f2', audio:'frag2', decoys:2, escapes:1 },
    { bg:'r3', img:'f3', audio:'frag3', decoys:2, escapes:1 },
    { bg:'r4', img:'f4', audio:'frag4', decoys:3, escapes:1 },
  ];
  const BETWEEN = ['……きれた。でも、たしかに いた', '……また とんでいった。おいかける', '……こんどの こえは、ちかい'];

  // ---------- 音: ノイズ・偽信号（WebAudio）と断片 ----------
  let AC = null, noiseGain = null, decoyGain = null;
  function initAudio() {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const len = AC.sampleRate * 2;
    const buf = AC.createBuffer(1, len, AC.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * .6;
    // 砂嵐
    const srcN = AC.createBufferSource(); srcN.buffer = buf; srcN.loop = true;
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 3200;
    noiseGain = AC.createGain(); noiseGain.gain.value = .18;
    srcN.connect(f).connect(noiseGain).connect(AC.destination);
    srcN.start();
    // 偽信号: 揺れる帯域ノイズ（声のものまね）
    const srcD = AC.createBufferSource(); srcD.buffer = buf; srcD.loop = true;
    const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 700; bp.Q.value = 9;
    const lfo = AC.createOscillator(); lfo.frequency.value = 4.2;
    const lfoG = AC.createGain(); lfoG.gain.value = 420;
    lfo.connect(lfoG).connect(bp.frequency); lfo.start();
    decoyGain = AC.createGain(); decoyGain.gain.value = 0;
    srcD.connect(bp).connect(decoyGain).connect(AC.destination);
    srcD.start();
  }
  function seTone(freq, dur, type, gain, when, slide) { try {
    const t = AC.currentTime + (when || 0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + .02);
  } catch (_) {} }
  const seSuccess = () => { seTone(1046, .5, 'sine', .12); seTone(1568, .7, 'sine', .1, .12); };
  const seDecoyPop = () => seTone(900, .5, 'sawtooth', .12, 0, 90);
  const seEscape = () => seTone(600, .3, 'square', .07, 0, 1800);

  const frag = {};
  ROUNDS.forEach(r => { frag[r.audio] = new Audio(`assets/audio/${r.audio}.mp3`); });
  const endTrack = new Audio('assets/audio/ending.mp3');

  // ---------- チューニング状態 ----------
  const FMIN = 76, FMAX = 90, TOL = 0.35;
  let dial = 80, ri = 0, seeking = false, lockT = 0, playingFrag = false;
  let peaks = [];        // {f, real, alive}
  let escapesLeft = 0;
  let dragX = null;

  stage.addEventListener('pointerdown', e => { dragX = e.clientX; hintline.style.opacity = 0; });
  stage.addEventListener('pointermove', e => {
    if (dragX === null || !seeking) return;
    const r = stage.getBoundingClientRect();
    dial += (e.clientX - dragX) / r.width * (FMAX - FMIN) * .8;
    dial = Math.max(FMIN, Math.min(FMAX, dial));
    dragX = e.clientX;
  });
  const endDrag = () => dragX = null;
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointerleave', endDrag);

  // ---------- 目盛り ----------
  const scale = $('scale');
  for (let f = FMIN; f <= FMAX; f += 2) {
    const p = (f - FMIN) / (FMAX - FMIN) * 100;
    const t = document.createElement('div'); t.className = 'tickL'; t.style.left = p + '%';
    const n = document.createElement('div'); n.className = 'tickN'; n.style.left = p + '%'; n.textContent = f;
    scale.appendChild(t); scale.appendChild(n);
  }

  function makePeaks(nDecoy) {
    const list = [];
    const used = [];
    const pick = () => {
      for (let tries = 0; tries < 60; tries++) {
        const f = FMIN + 1.2 + Math.random() * (FMAX - FMIN - 2.4);
        if (used.every(u => Math.abs(u - f) > 2.2) && Math.abs(f - dial) > 1.5) { used.push(f); return f; }
      }
      return FMIN + 2 + used.length * 3;
    };
    list.push({ f: pick(), real: true, alive: true });
    for (let i = 0; i < nDecoy; i++) list.push({ f: pick(), real: false, alive: true });
    return list;
  }

  // ---------- ループ ----------
  let lastT = 0, drift = 0;
  function loop(ts) {
    const dt = Math.min(.05, (ts - lastT) / 1000 || .016); lastT = ts;
    let nearest = null, nd = 1e9;
    for (const p of peaks) {
      if (!p.alive) continue;
      const d = Math.abs(dial - p.f);
      if (d < nd) { nd = d; nearest = p; }
    }
    const clarity = nearest ? Math.max(0, 1 - nd / 2.6) : 0;
    if (seeking && nearest) {
      // 本物だけ、ほんの少し漂う
      drift += dt;
      const real = peaks.find(p => p.real);
      if (real && real.alive) real.f = Math.max(FMIN + 1, Math.min(FMAX - 1, real.f + Math.sin(drift * .5) * .05 * dt));
      // 音: 本物=歌 / 偽物=ものまねノイズ
      const a = frag[ROUNDS[ri].audio];
      if (nearest.real) { a.volume = Math.pow(clarity, 1.6); if (decoyGain) decoyGain.gain.value = 0; }
      else { a.volume = 0; if (decoyGain) decoyGain.gain.value = Math.pow(clarity, 1.6) * .5; }
      if (noiseGain) noiseGain.gain.value = .04 + (1 - clarity) * .15;
      // ロック判定
      if (nd < TOL) {
        lockT += dt;
        const pct = Math.min(1, lockT / 1.2);
        lockring.style.opacity = 1; lockpct.style.opacity = 1;
        lockring.style.transform = `scale(${.8 + pct * .4}) rotate(${pct * 180}deg)`;
        lockpct.textContent = Math.round(pct * 100) + '%';
        if (pct >= .55 && nearest.real && escapesLeft > 0) {   // 掴みかけると一度にげる
          escapesLeft--;
          const jump = (Math.random() < .5 ? -1 : 1) * (2.4 + Math.random() * 1.2);
          nearest.f = Math.max(FMIN + 1, Math.min(FMAX - 1, nearest.f + jump));
          lockT = 0; lockring.style.opacity = 0; lockpct.style.opacity = 0;
          seEscape();
          flashMono('あっ——にげた');
        } else if (lockT >= 1.2) {
          lockT = 0; lockring.style.opacity = 0; lockpct.style.opacity = 0;
          nearest.real ? connected() : decoyBust(nearest);
        }
      } else { lockT = Math.max(0, lockT - dt * 2); if (lockT <= 0) { lockring.style.opacity = 0; lockpct.style.opacity = 0; } }
      sig.textContent = 'SIGNAL ' + '▮'.repeat(Math.round(clarity * 8)).padEnd(8, '▯');
    }
    needle.style.left = ((dial - FMIN) / (FMAX - FMIN) * 100) + '%';
    freqEl.textContent = dial.toFixed(1) + ' MHz';
    drawStatic(playingFrag ? 0.02 : 1 - clarity);
    drawSpec(ts, clarity);
    requestAnimationFrame(loop);
  }

  let flashT = null;
  function flashMono(s) {
    mline.textContent = s; mline.classList.add('on');
    clearTimeout(flashT);
    flashT = setTimeout(() => mline.classList.remove('on'), 1600);
  }

  function drawStatic(a) {
    sctx.clearRect(0, 0, 640, 360);
    if (a <= 0.01) return;
    const img = sctx.createImageData(640, 360);
    const px = img.data;
    const n = 640 * 360;
    for (let i = 0; i < n; i++) {
      if (Math.random() > a * .9) continue;
      const v = Math.random() * 255;
      const o = i * 4;
      px[o] = v; px[o+1] = v * .92; px[o+2] = Math.min(255, v * 1.1); px[o+3] = 210 * a;
    }
    sctx.putImageData(img, 0, 0);
  }
  function drawSpec(ts, clarity) {   // スペクトラム: ノイズ床＋生きてるピークのこぶ
    const w = 1000, h = 120;
    pctx.clearRect(0, 0, w, h);
    pctx.beginPath();
    for (let x = 0; x <= w; x += 4) {
      const f = FMIN + x / w * (FMAX - FMIN);
      let y = 12 + Math.random() * 10 + Math.sin(x * .05 + ts * .004) * 4;
      for (const p of peaks) {
        if (!p.alive) continue;
        const d = (f - p.f) / .55;
        y += Math.exp(-d * d) * (54 + Math.sin(ts * .01 + p.f) * 8);
      }
      const py = h - Math.min(h - 4, y);
      x === 0 ? pctx.moveTo(x, py) : pctx.lineTo(x, py);
    }
    pctx.strokeStyle = 'rgba(255,150,235,.85)'; pctx.lineWidth = 2; pctx.stroke();
    // 針位置の光
    const nx = (dial - FMIN) / (FMAX - FMIN) * w;
    const grd = pctx.createLinearGradient(nx - 26, 0, nx + 26, 0);
    grd.addColorStop(0, 'rgba(255,120,220,0)'); grd.addColorStop(.5, `rgba(255,120,220,${.12 + clarity * .3})`); grd.addColorStop(1, 'rgba(255,120,220,0)');
    pctx.fillStyle = grd; pctx.fillRect(nx - 26, 0, 52, h);
  }

  // ---------- 偽物・本物 ----------
  function decoyBust(p) {
    p.alive = false;
    seDecoyPop();
    if (decoyGain) decoyGain.gain.value = 0;
    flashMono('……ちがう。ノイズの ものまねだ');
  }
  async function connected() {
    seeking = false; playingFrag = true;
    hintline.style.opacity = 0;
    if (noiseGain) noiseGain.gain.value = .015;
    if (decoyGain) decoyGain.gain.value = 0;
    seSuccess();
    const lf = $('lockflash');
    lf.style.transition = 'none'; lf.style.opacity = .85;
    setTimeout(() => { lf.style.transition = 'opacity .9s'; lf.style.opacity = 0; }, 60);
    $('connected').classList.add('on');
    await wait(1300);
    $('connected').classList.remove('on');
    const R = ROUNDS[ri];
    scene.src = IMG(R.img);                 // 歌詞焼き込みの実画像（別途字幕は出さない）
    const a = frag[R.audio];
    a.volume = 1; a.currentTime = 0; a.play().catch(() => {});
    const tick = () => { if (!a.ended) requestAnimationFrame(tick); else afterFrag(); };
    requestAnimationFrame(tick);
  }

  function afterFrag() {
    playingFrag = false;
    if (ri + 1 >= ROUNDS.length) { lastQuestion(); return; }
    mline.textContent = BETWEEN[ri]; mline.classList.add('on');
    setTimeout(() => {
      mline.classList.remove('on');
      ri++;
      startRound();
    }, 2400);
  }

  function startRound() {
    const R = ROUNDS[ri];
    scene.style.opacity = 0;
    setTimeout(() => {
      scene.src = IMG(R.bg);
      scene.onload = () => {
        scene.onload = null;   // 残留onloadで別srcの読込時に再発火するのを防ぐ
        scene.style.opacity = 1;
        peaks = makePeaks(R.decoys);
        escapesLeft = R.escapes;
        lockT = 0;
        seeking = true;
        if (ri === 0) flashMono('やまが ' + (R.decoys + 1) + 'つ。ほんものは ひとつ');
        else flashMono('やまが ' + (R.decoys + 1) + 'つ');
        if (PEEK !== null) autoTune();
      };
    }, 1200);
  }

  function lastQuestion() {
    if (noiseGain) noiseGain.gain.value = 0;
    mline.textContent = '……もう、あわせなくても いい きがした'; mline.classList.add('on');
    ui.innerHTML = ''; ui.classList.add('on');
    const b = document.createElement('button'); b.className = 'cbtn';
    b.textContent = '— アンテナを ぜんぶ キミに むける —';
    b.addEventListener('click', e => { e.stopPropagation(); ui.classList.remove('on'); mline.classList.remove('on'); startEnding(); });
    ui.appendChild(b);
    if (PEEK !== null) setTimeout(() => b.click(), 900);
  }

  // ---------- エンディング（ending.mp3 = 原曲151.8s〜 / 絵の切替のみ・歌詞は焼き込み画像に任せる） ----------
  const ECUT = [
    { t: 0,     img: 'e1' },   // それでいい
    { t: 4.01,  img: 'e2' },   // ここにいるよ
    { t: 8.23,  img: 'e3' },   // 信号待ってる
    { t: 16.26, img: 'e4' },   // 光が届く速さで
    { t: 24.32, img: 'e5' },   // また明日
    { t: 32.78, img: 'e6' },   // キミも受信してる
  ];
  function startEnding() {
    const ov = $('ending'), bg = $('endbg');
    ov.style.pointerEvents = 'auto'; ov.style.opacity = 1;
    endTrack.volume = 1; endTrack.play().catch(() => {});
    let li = -1;
    const tick = () => {
      const t = endTrack.currentTime;
      let cur = 0;
      for (let i = 0; i < ECUT.length; i++) if (t >= ECUT[i].t) cur = i;
      if (cur !== li) { li = cur; if (bg.src.indexOf(ECUT[cur].img) === -1) bg.src = IMG(ECUT[cur].img); }
      if (!endTrack.ended) requestAnimationFrame(tick);
      else { bg.src = IMG('card'); setTimeout(() => $('endcard').style.display = 'flex', 1500); }
    };
    requestAnimationFrame(tick);
    $('again').addEventListener('click', () => location.reload());
  }

  // ---------- PEEK: 自動チューニング（偽物も一度つかんで検証） ----------
  function autoTune() {
    let phase = 0;   // 0=まず偽物へ 1=本物へ
    const iv = setInterval(() => {
      if (!seeking) { clearInterval(iv); return; }
      const targetPeak =
        (phase === 0 && peaks.find(p => !p.real && p.alive)) || peaks.find(p => p.real && p.alive);
      if (!targetPeak) return;
      if (phase === 0 && !peaks.some(p => !p.real && p.alive)) phase = 1;
      dial += Math.max(-2.4, Math.min(2.4, (targetPeak.f - dial))) * .09;
      if (phase === 0 && !targetPeak.alive) phase = 1;
    }, 40);
  }

  // ---------- 起動 ----------
  const toLoad = ['title','r1','r2','r3','r4','f1','f2','f3','f4','e1','e2','e3','e4','e5','e6','card'];
  let loaded = 0;
  const startBtn = $('start');
  toLoad.forEach(n => { const im = new Image(); im.onload = im.onerror = () => {
    loaded++;
    startBtn.textContent = loaded >= toLoad.length ? '— でんげんを いれる —' : `よみこみちゅう… ${Math.round(loaded/toLoad.length*100)}%`;
    if (loaded >= toLoad.length) { startBtn.disabled = false; if (PEEK !== null) startBtn.click(); }
  }; im.src = IMG(n); });

  startBtn.addEventListener('click', () => {
    $('title').style.opacity = 0;
    setTimeout(() => $('title').style.display = 'none', 1500);
    try { initAudio(); } catch (_) {}
    requestAnimationFrame(loop);
    hintline.style.opacity = 1;
    if (PEEK === 'ending') { startEnding(); return; }
    ri = 0;
    startRound();
  });
})();
</script>
