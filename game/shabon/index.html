<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>シャボン — われるまえが いちばんきれい | JP RECORDS</title>
<meta name="description" content="JP「シャボン」の世界。押すとふくらむ。はなすとしぼむ。うすい膜ほど、あざやかに色づく。どのシャボンも、かならず割れる。">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; background:#f3e9e2; touch-action:none; }
  body { font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif; color:#4a4356;
         display:flex; align-items:center; justify-content:center; user-select:none; -webkit-user-select:none; }

  #stage { position:relative; aspect-ratio:16/9; width:min(100vw, calc(100vh * 16 / 9));
           background:#f3e9e2; overflow:hidden; cursor:pointer; }
  #scene { position:absolute; inset:0; width:100%; height:100%; object-fit:fill; transition:opacity 1.4s ease; }
  #cv { position:absolute; inset:0; width:100%; height:100%; }

  #mono { position:absolute; left:0; right:0; bottom:10%; text-align:center; pointer-events:none; }
  .mline { font-size:clamp(15px,2.8vh,26px); letter-spacing:.2em; line-height:2; color:#443d50;
           text-shadow:0 0 12px rgba(243,233,226,.95), 0 0 26px rgba(243,233,226,.9);
           opacity:0; transition:opacity 1.2s ease; }
  .mline.on { opacity:1; }

  #btime { position:absolute; left:3.5%; top:4.5%; font-size:clamp(13px,2.3vh,19px); letter-spacing:.18em;
           color:rgba(74,67,86,.85); text-shadow:0 0 10px rgba(243,233,226,.9); pointer-events:none;
           opacity:0; transition:opacity .8s; }
  #btime.glow { color:#8a6a2f; text-shadow:0 0 12px rgba(230,190,110,.65); }
  #rounds { position:absolute; right:3.5%; top:4.5%; display:flex; gap:1vh; pointer-events:none; }
  .rdot { width:1.5vh; height:1.5vh; border-radius:50%; border:1px solid rgba(74,67,86,.55); }
  .rdot.done { background:rgba(74,67,86,.35); }

  #hint { position:absolute; left:0; right:0; top:7%; text-align:center; font-size:clamp(13px,2.2vh,19px);
          letter-spacing:.3em; color:rgba(74,67,86,.75); text-shadow:0 0 10px rgba(243,233,226,.9);
          pointer-events:none; opacity:0; transition:opacity 1s; }

  #ui { position:absolute; left:0; right:0; bottom:8%; display:none; flex-direction:column; align-items:center; gap:1.8vh; }
  #ui.on { display:flex; }
  .cbtn { font-family:inherit; font-size:clamp(15px,2.5vh,23px); letter-spacing:.3em; text-indent:.3em; color:#443d50;
          background:rgba(250,244,238,.85); border:1px solid rgba(74,67,86,.45); border-radius:2em;
          padding:.6em 2em; cursor:pointer; transition:all .3s; }
  .cbtn:hover { background:rgba(74,67,86,.08); box-shadow:0 2px 16px rgba(74,67,86,.18); }

  .overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
             gap:3vh; text-align:center; z-index:10; }
  #title { background:rgba(243,233,226,.35); transition:opacity 1.6s; }
  #title .bg { position:absolute; inset:0; z-index:-1; }
  #title .bg img { width:100%; height:100%; object-fit:cover; }
  #title h1 { font-size:clamp(40px,9vh,88px); font-weight:500; letter-spacing:.4em; text-indent:.4em; color:#443d50;
              text-shadow:0 0 20px rgba(250,244,238,.9), 0 0 44px rgba(250,244,238,.8); }
  #title .sub { font-size:clamp(13px,2.1vh,18px); letter-spacing:.4em; text-indent:.4em; color:rgba(68,61,80,.85); }
  #start { margin-top:3.5vh; font-family:inherit; font-size:clamp(16px,2.5vh,23px); letter-spacing:.4em; text-indent:.4em;
           color:#443d50; background:rgba(250,244,238,.7); border:1px solid rgba(68,61,80,.5); border-radius:2em;
           padding:.85em 2.4em; cursor:pointer; transition:all .4s; }
  #start:disabled { opacity:.35; cursor:default; }
  #start:not(:disabled):hover { background:rgba(68,61,80,.08); box-shadow:0 2px 20px rgba(68,61,80,.2); }
  #title .credit { position:absolute; bottom:3vh; font-size:12px; letter-spacing:.2em; color:rgba(68,61,80,.5); }

  #ending { background:#efe4dc; opacity:0; pointer-events:none; transition:opacity 2.5s ease; z-index:20; }
  #ending .bg { position:absolute; inset:0; }
  #ending .bg img { width:100%; height:100%; object-fit:cover; transition:opacity 1.4s ease; }
  #elyric { position:relative; font-size:clamp(20px,3.6vh,34px); letter-spacing:.2em; line-height:2; color:#443d50;
            text-shadow:0 0 14px rgba(239,228,220,.95), 0 2px 26px rgba(239,228,220,.9);
            opacity:0; transition:opacity 1s ease; }
  #endcard { position:relative; display:none; flex-direction:column; align-items:center; gap:3.5vh; }
  #endcard .fin { font-size:clamp(20px,3.8vh,36px); letter-spacing:.3em; text-indent:.3em; color:#443d50; }
  #again { font-family:inherit; font-size:clamp(13px,2vh,16px); letter-spacing:.3em; text-indent:.3em;
           color:rgba(68,61,80,.75); background:transparent; border:none; cursor:pointer; }
</style>
</head>
<body>

<div id="stage">
  <img id="scene" src="assets/img/r1.jpg" alt="">
  <canvas id="cv" width="1280" height="720"></canvas>
  <div id="hint">おしてる あいだ、ふくらむ　／　はなすと、しぼむ</div>
  <div id="btime">きれい 0.0 びょう</div>
  <div id="rounds"></div>
  <div id="mono"><div class="mline" id="mline"></div></div>
  <div id="ui"></div>
</div>

<div class="overlay" id="title">
  <div class="bg"><img src="assets/img/title.jpg" alt=""></div>
  <h1>シャボン</h1>
  <div class="sub">— われるまえが いちばん きれい —</div>
  <button id="start" disabled>よみこみちゅう…</button>
  <div class="credit">JP — AI MUSIC #113「シャボン」</div>
</div>

<div class="overlay" id="ending">
  <div class="bg"><img id="endbg" src="assets/img/e1.jpg" alt=""></div>
  <div id="elyric"></div>
  <div id="endcard">
    <div class="fin" id="fintext">きれいの じかん</div>
    <button id="again">— もういちど ふく —</button>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const stage = $('stage'), scene = $('scene'), cv = $('cv'), ctx = cv.getContext('2d'),
        mline = $('mline'), hint = $('hint'), ui = $('ui'), rounds = $('rounds');
  const IMG = n => `assets/img/${n}.jpg`;
  const PEEK = new URLSearchParams(location.search).get('peek');
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const W = 1280, H = 720;

  const bgm = new Audio('assets/audio/bgm_loop.mp3'); bgm.loop = true; bgm.volume = .55;
  const endTrack = new Audio('assets/audio/ending.mp3');

  let AC = null;
  const ac = () => AC || (AC = new (window.AudioContext || window.webkitAudioContext)());
  function tone(freq, dur, type, gain, when) { try {
    const t = ac().currentTime + (when || 0);
    const o = ac().createOscillator(), g = ac().createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(ac().destination); o.start(t); o.stop(t + dur + .02);
  } catch (_) {} }
  const seBell = () => tone(2637, 1.2, 'sine', .035);           // 微かな鈴（きれいゾーン）
  const sePop  = () => { tone(1200, .04, 'sine', .05); tone(400, .06, 'sine', .03, .02); };  // ちいさな ぱちん

  // ---------- 泡 ----------
  const ROUNDS = [
    { bg:'r1', rmax:150, after:'ぱちん。おとも なく' },
    { bg:'r2', rmax:135, after:'てのひらが ぬれた' },
    { bg:'r3', rmax:160, after:'いちばん きれいな ときだった' },
    { bg:'r4', rmax:128, after:'あとかたは のこらない' },
    { bg:'r5', rmax:142, after:'……それでも' },
  ];
  let ri = 0, R = 0, holding = false, playing = false, beautyT = 0, bellAt = 0;
  let roundStart = 0, gustV = 0, nextGust = 0, petals = [], drops = [];
  const BX = W / 2, BY = H * .46;

  function startRound(i) {
    ri = i;
    [...rounds.children].forEach((d, k) => d.classList.toggle('done', k < i));
    scene.style.opacity = 0;
    setTimeout(() => {
      scene.src = IMG(ROUNDS[i].bg);
      scene.onload = () => {
        scene.style.opacity = 1;
        R = 24; holding = false; playing = true;
        roundStart = performance.now(); nextGust = performance.now() + 2600 + Math.random() * 1800;
        hint.style.opacity = i === 0 ? 1 : 0;
        mline.classList.remove('on');
        if (PEEK !== null) autoHold();
      };
    }, i === 0 ? 100 : 1400);
  }

  stage.addEventListener('pointerdown', () => { holding = true; hint.style.opacity = 0; });
  stage.addEventListener('pointerup', () => holding = false);
  stage.addEventListener('pointerleave', () => holding = false);
  window.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); holding = true; hint.style.opacity = 0; } });
  window.addEventListener('keyup', e => { if (e.code === 'Space') holding = false; });

  // ---------- ループ ----------
  let lastT = 0;
  function loop(ts) {
    const dt = Math.min(.04, (ts - lastT) / 1000 || .016); lastT = ts;
    ctx.clearRect(0, 0, W, H);
    if (playing) {
      const rm = ROUNDS[ri].rmax;
      const elapsed = (ts - roundStart) / 1000;
      // ふくらみ・しぼみ・突風
      if (holding) R += 22 * dt; else R -= 6 * dt;
      if (ts > nextGust) {
        gustV = (elapsed > 30 ? 30 : 8 + Math.random() * 22);
        nextGust = ts + 2200 + Math.random() * 2000;
        spawnPetals();
      }
      if (gustV > 0) { const g = Math.min(gustV, 26 * dt * 3); R += g; gustV -= g; }
      R = Math.max(18, R);
      // きれいゾーン
      const I = Math.max(0, Math.min(1, (R - .55 * rm) / (.45 * rm)));
      if (R > .82 * rm) {
        beautyT += dt;
        if (ts - bellAt > 2600) { bellAt = ts; seBell(); }
      }
      if (R >= rm) burst();
      else {
        drawZone(rm, R, ts);
        drawBubble(R, I, ts);
      }
      const bt = $('btime');
      bt.style.opacity = 1;
      bt.textContent = 'きれい ' + beautyT.toFixed(1) + ' びょう';
      bt.classList.toggle('glow', R > .82 * rm);
    }
    drawParticles(dt);
    requestAnimationFrame(loop);
  }

  function drawZone(rm, r, ts) {   // きれいゾーン: この輪まで ふくらませて たもつ
    const inZone = r > .82 * rm;
    ctx.save();
    ctx.translate(BX + Math.sin(ts / 1000 * .9) * 8, BY + Math.cos(ts / 1000 * .7) * 6);
    ctx.setLineDash([7, 9]);
    ctx.lineWidth = inZone ? 2.2 : 1.4;
    ctx.strokeStyle = inZone ? 'rgba(216,170,90,.85)' : 'rgba(74,67,86,.4)';
    ctx.beginPath(); ctx.arc(0, 0, rm * .9, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    if (ri === 0 && !inZone && beautyT < 1) {
      ctx.fillStyle = 'rgba(74,67,86,.75)';
      ctx.font = `${Math.round(H * .026)}px "Yu Mincho","Hiragino Mincho ProN",serif`;
      ctx.textAlign = 'center';
      ctx.fillText('この わっか まで ふくらませて、たもつ', 0, -rm * .9 - 14);
    }
    ctx.restore();
  }

  function drawBubble(r, I, ts) {
    const wob = (1 + I * 2.2);
    const t = ts / 1000;
    ctx.save();
    ctx.translate(BX + Math.sin(t * .9) * 8, BY + Math.cos(t * .7) * 6);
    // 本体（ほぼ透明）
    ctx.beginPath();
    for (let a = 0; a <= Math.PI * 2 + .01; a += .06) {
      const rr = r + Math.sin(a * 5 + t * 3) * wob + Math.cos(a * 3 - t * 2.2) * wob * .7;
      const x = Math.cos(a) * rr, y = Math.sin(a) * rr;
      a === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
    const body = ctx.createRadialGradient(0, 0, r * .3, 0, 0, r);
    body.addColorStop(0, 'rgba(255,255,255,0)');
    body.addColorStop(.82, 'rgba(255,255,255,.05)');
    body.addColorStop(1, `rgba(255,255,255,${.14 + I * .1})`);
    ctx.fillStyle = body; ctx.fill();
    // 虹色リム（Iで鮮やかに）
    for (let k = 0; k < 3; k++) {
      const hue = (t * (30 + I * 160) + k * 120) % 360;
      ctx.beginPath();
      ctx.arc(0, 0, r, t * (.6 + k * .3) % (Math.PI * 2), t * (.6 + k * .3) % (Math.PI * 2) + Math.PI * (.8 + I * .6));
      ctx.strokeStyle = `hsla(${hue}, ${45 + I * 55}%, ${70 - I * 8}%, ${.25 + I * .55})`;
      ctx.lineWidth = 2.5 + I * 3.5;
      ctx.stroke();
    }
    // ハイライト
    ctx.beginPath(); ctx.ellipse(-r * .38, -r * .42, r * .16, r * .09, -.6, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${.5 + I * .3})`; ctx.fill();
    ctx.restore();
  }

  function spawnPetals() {
    for (let i = 0; i < 7; i++)
      petals.push({ x: -30 - Math.random() * 120, y: Math.random() * H * .8,
                    vx: 220 + Math.random() * 140, vy: 20 + Math.random() * 50, life: 1.6 });
  }
  function drawParticles(dt) {
    petals = petals.filter(p => (p.life -= dt) > 0);
    ctx.fillStyle = 'rgba(240,190,200,.6)';
    for (const p of petals) {
      p.x += p.vx * dt; p.y += p.vy * dt;
      ctx.beginPath(); ctx.ellipse(p.x, p.y, 5, 2.6, p.life * 4, 0, Math.PI * 2); ctx.fill();
    }
    drops = drops.filter(d => (d.life -= dt) > 0);
    ctx.fillStyle = 'rgba(200,215,235,.75)';
    for (const d of drops) {
      d.vy += 700 * dt; d.x += d.vx * dt; d.y += d.vy * dt;
      ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();
    }
  }

  function burst() {
    playing = false;
    sePop();
    for (let i = 0; i < 26; i++) {
      const a = Math.random() * Math.PI * 2, rr = R * (0.6 + Math.random() * 0.4);
      drops.push({ x: BX + Math.cos(a) * rr, y: BY + Math.sin(a) * rr,
                   vx: Math.cos(a) * (40 + Math.random() * 90), vy: Math.sin(a) * 60 - 40,
                   r: 1.5 + Math.random() * 3, life: 1.4 + Math.random() });
    }
    setTimeout(() => {
      mline.textContent = ROUNDS[ri].after; mline.classList.add('on');
      setTimeout(() => {
        if (ri + 1 < ROUNDS.length) startRound(ri + 1);
        else lastQuestion();
      }, 2100);
    }, 900);
  }

  function lastQuestion() {
    mline.classList.remove('on');
    setTimeout(() => {
      mline.textContent = 'もういちど、ふくらませても いい？'; mline.classList.add('on');
      ui.innerHTML = ''; ui.classList.add('on');
      const b = document.createElement('button'); b.className = 'cbtn'; b.textContent = '— いきを すいこむ —';
      b.addEventListener('click', e => { e.stopPropagation(); ui.classList.remove('on'); mline.classList.remove('on'); startEnding(); });
      ui.appendChild(b);
      if (PEEK !== null) setTimeout(() => b.click(), 800);
    }, 1000);
  }

  // ---------- エンディング（ending.mp3 = 原曲129.7s〜 / SRT実測−129.7s） ----------
  const LYRICS = [
    { t: 0.17,  e: 4.34,  x: 'あとかたなんて　残らないけど',       img: 'e1' },
    { t: 4.38,  e: 9.43,  x: '濡れたてのひらが　教えてくれる',     img: 'e1' },
    { t: 9.45,  e: 13.35, x: '「ここにあったよ」って',             img: 'e2' },
    { t: 13.37, e: 17.83, x: '確かにあったんだ',                   img: 'e2' },
    { t: 17.85, e: 20.67, x: 'シャボン　もう一度ふくらませて',     img: 'e3' },
    { t: 20.69, e: 22.81, x: '虹色が　また壊れたとしても',         img: 'e3' },
    { t: 22.84, e: 26.25, x: 'ぼくはきっとまた　息を吹き込む',     img: 'e3' },
    { t: 26.28, e: 28.88, x: 'シャボン　消えると知っていても',     img: 'e4' },
    { t: 28.91, e: 31.41, x: '淡い期待を　手放さない',             img: 'e4' },
    { t: 31.45, e: 35.73, x: '何度でも　またふくらませる',         img: 'e4' },
  ];
  function startEnding() {
    const f = setInterval(() => { bgm.volume = Math.max(0, bgm.volume - .05); if (bgm.volume <= 0) { bgm.pause(); clearInterval(f); } }, 100);
    const ov = $('ending'), ly = $('elyric'), bg = $('endbg');
    ov.style.pointerEvents = 'auto'; ov.style.opacity = 1;
    $('fintext').textContent = 'きれいの じかん: ' + beautyT.toFixed(1) + ' びょう';
    endTrack.volume = 1; endTrack.play().catch(() => {});
    let li = -1;
    const tick = () => {
      const t = endTrack.currentTime;
      const cur = LYRICS.findIndex(L => t >= L.t && t <= L.e);
      if (cur !== li) {
        if (cur === -1) ly.style.opacity = 0;
        else {
          ly.textContent = LYRICS[cur].x; ly.style.opacity = 1;
          if (bg.src.indexOf(LYRICS[cur].img) === -1) bg.src = IMG(LYRICS[cur].img);
        }
        li = cur;
      }
      if (!endTrack.ended) requestAnimationFrame(tick);
      else { ly.style.opacity = 0; setTimeout(() => $('endcard').style.display = 'flex', 1500); }
    };
    requestAnimationFrame(tick);
    $('again').addEventListener('click', () => location.reload());
  }

  // ---------- PEEK: 自動ホールド ----------
  function autoHold() {
    const rm = ROUNDS[ri].rmax;
    const iv = setInterval(() => {
      if (!playing) { clearInterval(iv); holding = false; return; }
      holding = R < rm * .9;   // きれいゾーンに保つ → 突風でいずれ割れる
    }, 80);
  }

  // ---------- 起動 ----------
  ROUNDS.forEach(() => { const d = document.createElement('div'); d.className = 'rdot'; rounds.appendChild(d); });
  const toLoad = ['title','r1','r2','r3','r4','r5','e1','e2','e3','e4'];
  let loaded = 0;
  const startBtn = $('start');
  toLoad.forEach(n => { const im = new Image(); im.onload = im.onerror = () => {
    loaded++;
    startBtn.textContent = loaded >= toLoad.length ? '— いきを ふきこむ —' : `よみこみちゅう… ${Math.round(loaded/toLoad.length*100)}%`;
    if (loaded >= toLoad.length) { startBtn.disabled = false; if (PEEK !== null) startBtn.click(); }
  }; im.src = IMG(n); });

  startBtn.addEventListener('click', () => {
    $('title').style.opacity = 0;
    setTimeout(() => $('title').style.display = 'none', 1500);
    bgm.play().catch(() => {});
    requestAnimationFrame(loop);
    if (PEEK === 'ending') { startEnding(); return; }
    // 目的をさきに言う（われることは まけじゃない）
    (async () => {
      const say = async (s, ms) => { mline.textContent = s; mline.classList.add('on'); await wait(ms); mline.classList.remove('on'); await wait(450); };
      await say('シャボンは かならず われます', PEEK !== null ? 700 : 2300);
      await say('われる まえの、いちばん きれいな じかんを あつめる あそびです', PEEK !== null ? 700 : 3000);
      startRound(0);
    })();
  });
})();
</script>
</body>
</html>
